<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Genetic Data Analysis{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-left">
                <a href="/"><i class="fas fa-dna logo"></i></a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item dropdown">
                    <a href="#" class="dropbtn">Home</a>
                    <div class="dropdown-content">
                        <a href="/about">About SarcDBase</a>
                    </div>
                </li>
                <li class="nav-item dropdown">
                    <a href="#" class="dropbtn">Analysis</a>
                    <div class="dropdown-content">
                        <a href="/analysis/overview">Overview</a>
                        <a href="/analysis/who">WHO analysis</a>
                    </div>
                </li>
                <li class="nav-item dropdown">
                    <a href="#" class="dropbtn">Visualization</a>
                    <div class="dropdown-content">
                        <a href="/visualization/overview">Overview</a>
                        <a href="/visualization/copy_number">Copy Number</a>
                    </div>
                </li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <main>
            {% block content %}
            {% endblock %}
        </main>
    </div>
    <footer>
        <p>&copy; 2024 Your Genetic Data Analysis App</p>
    </footer>
</body>
</html>
